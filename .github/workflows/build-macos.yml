name: Build Mac applications

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Mac architecture to build
        type: choice
        options: [both, silicon, intel]
        default: both
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Mac ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'AppleSilicon' && 'macos-14' || 'macos-15-intel' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.platform == 'silicon' && '["AppleSilicon"]' || inputs.platform == 'intel' && '["Intel"]' || '["AppleSilicon","Intel"]') }}
    env:
      EXPECTED_ARCH: ${{ matrix.name == 'AppleSilicon' && 'arm64' || 'x86_64' }}
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install official Python with Tkinter
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/python-3.13.16-macos11.pkg"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://www.python.org/ftp/python/3.13.16/python-3.13.16-macos11.pkg -o "$pkg"
          echo "30666509020b4da0dd8bc2e773255f34d76b7bb80b66960a928d5f6daa0192d7  $pkg" | shasum -a 256 -c -
          pkgutil --check-signature "$pkg"
          sudo installer -pkg "$pkg" -target /
          bash '/Applications/Python 3.13/Install Certificates.command'
          echo '/Library/Frameworks/Python.framework/Versions/3.13/bin' >> "$GITHUB_PATH"
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .build-venv
          echo "$GITHUB_WORKSPACE/.build-venv/bin" >> "$GITHUB_PATH"
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install --only-binary=:all: -r requirements-build.txt
      - name: Check architecture, Tkinter and dependencies
        run: |
          python -c "import os,platform; assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine()"
          python mac/check_environment.py
      - name: Build application and disk image
        run: python build.py
      - name: Verify frozen application and prepare downloads
        run: python ci/verify_macos.py
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: XRD-Plotter-Mac-${{ matrix.name }}
          path: cloud-output/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostic files on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Mac-${{ matrix.name }}-diagnostics
          path: |
            build/**/warn-*.txt
            build/**/xref-*.html
          if-no-files-found: ignore
